[project]
name = "python-project"
version = "0.1.0"
description = "A minimal Python project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
python-project = "python_project.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
